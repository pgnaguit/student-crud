spring.application.name=student-api

server.port=${PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Supports both Render environment variables and local defaults
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_student}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optimizes the SQL generation specifically for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prints executed SQL queries to the console log (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
